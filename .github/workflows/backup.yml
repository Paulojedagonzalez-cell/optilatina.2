name: Respaldo diario de Firestore

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC diario (~02:00 Venezuela)
  workflow_dispatch: {}       # permite ejecutarlo a mano desde GitHub

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Exportar base de datos
        run: node scripts/backup-firestore.mjs

      - name: Guardar el respaldo (si cambió)
        run: |
          git config user.name "optilatina-backup[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add backups/latest.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos — no hay nada que guardar hoy."
          else
            git commit -m "chore(backup): respaldo automático $(date -u +%Y-%m-%d)"
            git push
          fi
